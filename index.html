<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titkos világom...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #333;
    border-top-color: #f5f5f5;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }
  .btn {
    display: inline-block;
    background: #f5f5f5;
    color: #0f0f0f;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    margin: 6px 0;
    width: 100%;
  }
  .steps {
    text-align: left;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #ddd;
    line-height: 1.7;
  }
  .steps b { color: #fff; }
  .hidden { display: none; }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #f5f5f5;
    color: #0f0f0f;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div id="loading">
    <div class="spinner"></div>
    <h1>Máris ott vagyunk...</h1>
  </div>

  <div id="copyFallback" class="hidden">
    <h1>Ez a link nem nyitható meg itt</h1>
    <div class="steps">
      1. Koppints a <b>⋯</b> ikonra jobb fent<br>
      2. Válaszd: <b>Megnyitás böngészőben</b><br>
      vagy<br>
      3. Másold ki a linket az alábbi gombbal, és illeszd be Chrome-ba
    </div>
    <button class="btn" id="copyBtn">Kattints ide, hogy másold a linket</button>
  </div>
</div>

<div class="toast" id="toast">Link másolva ✓</div>

<script>
  const DESTINATION_URL = "https://www.fanvue.com/bogardorcsi";
  const DEST_NO_SCHEME = DESTINATION_URL.replace(/^https?:\/\//, "");

  function getPlatform() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isTikTok = /TikTok|musical_ly|BytedanceWebview/i.test(ua);
    const isInstagram = /Instagram|FBAN|FBAV/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    let platform = "desktop";
    if (isIOS) platform = "ios";
    else if (isAndroid) platform = "android";
    return { platform, isTikTok, isInstagram };
  }

  function showCopyFallback() {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("copyFallback").classList.remove("hidden");
  }

  function copyLink() {
    const toast = document.getElementById("toast");
    function showToast() {
      toast.classList.add("show");
      setTimeout(function () { toast.classList.remove("show"); }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DESTINATION_URL).then(showToast).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      const ta = document.createElement("textarea");
      ta.value = DESTINATION_URL;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      showToast();
    }
  }

  function attemptTikTokEscape(platform) {
    let handled = false;
    window.addEventListener("pagehide", function () { handled = true; });
    window.addEventListener("visibilitychange", function () {
      if (document.hidden) handled = true;
    });

    if (platform === "ios") {
      window.location.href = "x-safari-https://" + DEST_NO_SCHEME;
    } else if (platform === "android") {
      window.location.href = "intent://" + DEST_NO_SCHEME +
        "#Intent;scheme=https;package=com.android.chrome;end;";
    }

    setTimeout(function () {
      if (!handled) showCopyFallback();
    }, 900);
  }

  window.addEventListener("DOMContentLoaded", function () {
    document.getElementById("copyBtn").addEventListener("click", copyLink);

    const p = getPlatform();
    const platform = p.platform;
    const isTikTok = p.isTikTok;
    const isInstagram = p.isInstagram;

    if (isTikTok) {
      attemptTikTokEscape(platform);
      return;
    }
    window.location.href = DESTINATION_URL;
  });
</script>

</body>
</html>
