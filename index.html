<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titkos világom...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #f5f5f5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #333;
    border-top-color: #f5f5f5;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    background: #f5f5f5;
    color: #0f0f0f;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <div id="loading">
    <div class="spinner"></div>
    <h1>Máris ott vagyunk...</h1>
    <p>Ha nem történik semmi, kattints lent....</p>
  </div>

  <div id="manual" class="hidden">
    <h1>Kattints a folytatásért</h1>
    <p>A legjobb élményért, kérlek folytasd böngészőben...</p>
    <button class="btn" onclick="goToDestination()">Katt a folytatáshoz</button>
  </div>
</div>

<script>
  // ==== EDIT THIS LINE ONLY ====
  const DESTINATION_URL = "https://www.fanvue.com/bogardorcsi";
  // =============================

  function isInAppBrowser() {
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    return /TikTok|musical_ly|BytedanceWebview|FBAN|FBAV|Instagram/i.test(ua);
  }

  function goToDestination() {
    window.location.href = DESTINATION_URL;
  }

  window.addEventListener("DOMContentLoaded", function () {
    if (isInAppBrowser()) {
      // In-app browsers often block or misbehave with the destination.
      // Show a manual "tap to continue" button instead of auto-redirecting,
      // since auto-redirects are what most easily get flagged.
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("manual").classList.remove("hidden");
    } else {
      // Regular browser: redirect automatically after a short delay.
      setTimeout(goToDestination, 500);
    }
  });
</script>

</body>
</html>
